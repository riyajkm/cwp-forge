name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi
      - name: Build tarball and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="${GITHUB_REPOSITORY##*/}-${version}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "${name}.tar.gz" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            *.tar.gz
            SHA256SUMS
