name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails on info-level findings too: keep scripts clean at every severity.
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: style

  exec-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts must be mode 100755
        run: |
          bad=$(git ls-files --stage -- '*.sh' | grep -v '^100755' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "run: git update-index --chmod=+x <file>"; exit 1; fi

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    name: php-lint (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint
        run: find . -name '*.php' -print0 | xargs -0 -r -n1 php -l

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: |
          if [ -n "$(find tests -name '*.bats' -print -quit)" ]; then
            bats tests/
          else
            echo "No .bats files yet"
          fi

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: INSTALLER_VERSION matches newest CHANGELOG heading
        run: |
          v=$(sed -n 's/^INSTALLER_VERSION=//p' install.sh | head -n1)
          c=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n1)
          echo "install.sh=$v changelog=$c"
          [ "$v" = "$c" ] || { echo "version mismatch"; exit 1; }
